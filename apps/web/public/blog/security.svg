<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="shield5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glow5" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg5)"/>
  <!-- Dot grid pattern -->
  <g fill="#38bdf8" opacity="0.04">
    <circle cx="50" cy="50" r="1.5"/><circle cx="100" cy="50" r="1.5"/><circle cx="150" cy="50" r="1.5"/>
    <circle cx="200" cy="50" r="1.5"/><circle cx="250" cy="50" r="1.5"/><circle cx="300" cy="50" r="1.5"/>
    <circle cx="350" cy="50" r="1.5"/><circle cx="400" cy="50" r="1.5"/><circle cx="450" cy="50" r="1.5"/>
    <circle cx="500" cy="50" r="1.5"/><circle cx="550" cy="50" r="1.5"/><circle cx="600" cy="50" r="1.5"/>
    <circle cx="650" cy="50" r="1.5"/><circle cx="700" cy="50" r="1.5"/><circle cx="750" cy="50" r="1.5"/>
    <circle cx="800" cy="50" r="1.5"/><circle cx="850" cy="50" r="1.5"/><circle cx="900" cy="50" r="1.5"/>
    <circle cx="950" cy="50" r="1.5"/><circle cx="1000" cy="50" r="1.5"/><circle cx="1050" cy="50" r="1.5"/>
    <circle cx="1100" cy="50" r="1.5"/><circle cx="1150" cy="50" r="1.5"/>
    <circle cx="50" cy="100" r="1.5"/><circle cx="100" cy="100" r="1.5"/><circle cx="150" cy="100" r="1.5"/>
    <circle cx="200" cy="100" r="1.5"/><circle cx="250" cy="100" r="1.5"/><circle cx="300" cy="100" r="1.5"/>
    <circle cx="50" cy="150" r="1.5"/><circle cx="100" cy="150" r="1.5"/><circle cx="150" cy="150" r="1.5"/>
    <circle cx="1000" cy="100" r="1.5"/><circle cx="1050" cy="100" r="1.5"/><circle cx="1100" cy="100" r="1.5"/>
    <circle cx="1150" cy="100" r="1.5"/><circle cx="1000" cy="150" r="1.5"/><circle cx="1050" cy="150" r="1.5"/>
    <circle cx="1100" cy="150" r="1.5"/><circle cx="1150" cy="150" r="1.5"/>
  </g>
  <!-- Central shield -->
  <g transform="translate(600,300)">
    <!-- Shield shape -->
    <path d="M0,-120 C80,-120 140,-100 140,-40 C140,40 80,110 0,140 C-80,110 -140,40 -140,-40 C-140,-100 -80,-120 0,-120Z"
          fill="url(#shield5)" opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
    <!-- Inner shield -->
    <path d="M0,-90 C60,-90 105,-75 105,-30 C105,30 60,82 0,105 C-60,82 -105,30 -105,-30 C-105,-75 -60,-90 0,-90Z"
          fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
    <!-- Lock icon inside shield -->
    <g fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <!-- Lock body -->
      <rect x="-25" y="-5" width="50" height="40" rx="5"/>
      <!-- Lock shackle -->
      <path d="M-15,-5 C-15,-30 15,-30 15,-5"/>
      <!-- Keyhole -->
      <circle cx="0" cy="15" r="5" fill="#38bdf8" opacity="0.6"/>
      <line x1="0" y1="20" x2="0" y2="30" stroke-width="3"/>
    </g>
    <!-- Pulse rings -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.1"/>
    <circle cx="0" cy="0" r="200" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.06"/>
  </g>
  <!-- Data flow lines -->
  <g fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.15">
    <path d="M100,315 L500,315"/>
    <path d="M700,315 L1100,315"/>
    <path d="M600,100 L600,180"/>
    <path d="M600,420 L600,530"/>
  </g>
  <!-- Glow overlay -->
  <rect width="1200" height="630" fill="url(#glow5)"/>
  <!-- Corner accents -->
  <rect x="40" y="40" width="60" height="3" rx="1.5" fill="#38bdf8" opacity="0.6"/>
  <rect x="40" y="40" width="3" height="60" rx="1.5" fill="#38bdf8" opacity="0.6"/>
  <rect x="1100" y="587" width="60" height="3" rx="1.5" fill="#38bdf8" opacity="0.6"/>
  <rect x="1157" y="530" width="3" height="60" rx="1.5" fill="#38bdf8" opacity="0.6"/>
</svg>