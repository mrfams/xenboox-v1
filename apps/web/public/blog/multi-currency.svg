<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="glow4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg4)"/>
  <!-- Subtle globe lines -->
  <g fill="none" stroke="#22c55e" stroke-width="1" opacity="0.08">
    <ellipse cx="600" cy="315" rx="400" ry="250"/>
    <ellipse cx="600" cy="315" rx="300" ry="250"/>
    <ellipse cx="600" cy="315" rx="200" ry="250"/>
    <ellipse cx="600" cy="315" rx="100" ry="250"/>
    <line x1="200" y1="315" x2="1000" y2="315"/>
    <line x1="600" y1="65" x2="600" y2="565"/>
    <path d="M220,180 Q600,120 980,180"/>
    <path d="M220,450 Q600,510 980,450"/>
  </g>
  <!-- Currency symbols floating -->
  <g font-family="Georgia, serif" font-weight="bold" text-anchor="middle">
    <!-- Large central D (Dalasi) -->
    <text x="600" y="340" font-size="120" fill="#22c55e" opacity="0.7">D</text>
    <!-- Surrounding currencies -->
    <text x="300" y="200" font-size="52" fill="#4ade80" opacity="0.4">$</text>
    <text x="900" y="200" font-size="48" fill="#4ade80" opacity="0.35">€</text>
    <text x="250" y="450" font-size="44" fill="#4ade80" opacity="0.3">£</text>
    <text x="950" y="440" font-size="46" fill="#4ade80" opacity="0.35">¥</text>
    <text x="150" y="320" font-size="36" fill="#4ade80" opacity="0.25">₣</text>
    <text x="1050" y="320" font-size="38" fill="#4ade80" opacity="0.25">₹</text>
    <text x="450" y="150" font-size="32" fill="#4ade80" opacity="0.2">₱</text>
    <text x="750" y="500" font-size="34" fill="#4ade80" opacity="0.2">₩</text>
  </g>
  <!-- Connecting arrows between currencies -->
  <g fill="none" stroke="#22c55e" stroke-width="2" opacity="0.25" stroke-dasharray="8,6">
    <path d="M340,200 C450,230 520,280 560,300"/>
    <path d="M640,300 C680,260 800,210 870,200"/>
    <path d="M320,430 C420,400 520,360 570,330"/>
    <path d="M630,340 C680,380 820,420 920,440"/>
  </g>
  <!-- Glow overlay -->
  <rect width="1200" height="630" fill="url(#glow4)"/>
  <!-- Corner accents -->
  <rect x="40" y="40" width="60" height="3" rx="1.5" fill="#22c55e" opacity="0.6"/>
  <rect x="40" y="40" width="3" height="60" rx="1.5" fill="#22c55e" opacity="0.6"/>
  <rect x="1100" y="587" width="60" height="3" rx="1.5" fill="#22c55e" opacity="0.6"/>
  <rect x="1157" y="530" width="3" height="60" rx="1.5" fill="#22c55e" opacity="0.6"/>
</svg>