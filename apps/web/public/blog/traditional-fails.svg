<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1207"/>
      <stop offset="100%" stop-color="#3d2409"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg2)"/>
  <!-- Diagonal warning stripes -->
  <g opacity="0.05" stroke="#f59e0b" stroke-width="40">
    <line x1="-100" y1="0" x2="200" y2="630"/>
    <line x1="100" y1="0" x2="400" y2="630"/>
    <line x1="300" y1="0" x2="600" y2="630"/>
    <line x1="500" y1="0" x2="800" y2="630"/>
    <line x1="700" y1="0" x2="1000" y2="630"/>
    <line x1="900" y1="0" x2="1200" y2="630"/>
    <line x1="1100" y1="0" x2="1400" y2="630"/>
  </g>
  <!-- Broken chain links -->
  <g transform="translate(600,315)" fill="none" stroke-width="4" stroke-linecap="round">
    <!-- Left chain -->
    <g stroke="#f59e0b" opacity="0.7">
      <rect x="-220" y="-20" width="60" height="40" rx="12"/>
      <rect x="-160" y="-20" width="60" height="40" rx="12"/>
      <rect x="-100" y="-20" width="60" height="40" rx="12"/>
    </g>
    <!-- Right chain -->
    <g stroke="#f59e0b" opacity="0.7">
      <rect x="100" y="-20" width="60" height="40" rx="12"/>
      <rect x="160" y="-20" width="60" height="40" rx="12"/>
      <rect x="220" y="-20" width="60" height="40" rx="12"/>
    </g>
    <!-- Broken center -->
    <g stroke="#ef4444" opacity="0.9">
      <path d="M-40,-20 C-40,-34 -20,-34 -20,-20 C-20,-6 -40,-6 -40,-20" stroke-dasharray="4,3"/>
      <path d="M20,20 C20,34 40,34 40,20 C40,6 20,6 20,20" stroke-dasharray="4,3"/>
    </g>
    <!-- Crack lightning bolt -->
    <g stroke="#ef4444" stroke-width="3" opacity="0.8">
      <polyline points="-25,-40 -5,-5 -20,-5 5,40"/>
    </g>
  </g>
  <!-- Warning triangles -->
  <g fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.3">
    <polygon points="150,120 180,70 210,120"/>
    <polygon points="990,510 1020,460 1050,510"/>
  </g>
  <!-- Accent glow -->
  <rect width="1200" height="630" fill="url(#accent2)"/>
  <!-- Corner accents -->
  <rect x="40" y="40" width="60" height="3" rx="1.5" fill="#f59e0b" opacity="0.6"/>
  <rect x="40" y="40" width="3" height="60" rx="1.5" fill="#f59e0b" opacity="0.6"/>
  <rect x="1100" y="587" width="60" height="3" rx="1.5" fill="#f59e0b" opacity="0.6"/>
  <rect x="1157" y="530" width="3" height="60" rx="1.5" fill="#f59e0b" opacity="0.6"/>
</svg>