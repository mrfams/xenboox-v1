<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="glow6" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="rocket6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg6)"/>
  <!-- Upward trajectory lines -->
  <g fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.1">
    <path d="M100,600 Q400,400 600,280 Q800,160 1100,80"/>
    <path d="M150,600 Q450,420 650,300 Q850,180 1150,100"/>
    <path d="M50,600 Q350,380 550,260 Q750,140 1050,60"/>
  </g>
  <!-- Step indicators along the path -->
  <g fill="#2dd4bf" opacity="0.3">
    <circle cx="300" cy="470" r="6"/>
    <circle cx="500" cy="340" r="8"/>
    <circle cx="700" cy="220" r="10"/>
    <circle cx="900" cy="140" r="7"/>
  </g>
  <!-- Step numbers -->
  <g font-family="system-ui, sans-serif" font-size="14" fill="#042f2e" font-weight="600" text-anchor="middle">
    <text x="300" y="475">1</text>
    <text x="500" y="345">2</text>
    <text x="700" y="225">3</text>
    <text x="900" y="145">4</text>
  </g>
  <!-- Rocket icon -->
  <g transform="translate(600,300) rotate(-45)">
    <!-- Rocket body -->
    <path d="M0,-60 C15,-60 20,-40 20,-10 L20,20 L-20,20 L-20,-10 C-20,-40 -15,-60 0,-60Z"
          fill="url(#rocket6)" opacity="0.8"/>
    <!-- Rocket nose -->
    <path d="M0,-80 C8,-75 10,-65 0,-60 C-10,-65 -8,-75 0,-80Z" fill="#5eead4"/>
    <!-- Window -->
    <circle cx="0" cy="-25" r="8" fill="#042f2e" stroke="#5eead4" stroke-width="1.5" opacity="0.7"/>
    <!-- Fins -->
    <path d="M-20,10 L-35,25 L-20,20Z" fill="#0d9488" opacity="0.6"/>
    <path d="M20,10 L35,25 L20,20Z" fill="#0d9488" opacity="0.6"/>
    <!-- Flame -->
    <g opacity="0.7">
      <path d="M-10,20 C-8,40 0,55 0,55 C0,55 8,40 10,20Z" fill="#fbbf24" opacity="0.8"/>
      <path d="M-5,20 C-3,35 0,45 0,45 C0,45 3,35 5,20Z" fill="#f97316" opacity="0.6"/>
    </g>
  </g>
  <!-- Star field -->
  <g fill="#2dd4bf" opacity="0.15">
    <circle cx="180" cy="120" r="1.5"/>
    <circle cx="320" cy="80" r="1"/>
    <circle cx="450" cy="150" r="1.2"/>
    <circle cx="780" cy="100" r="1.5"/>
    <circle cx="920" cy="180" r="1"/>
    <circle cx="1050" cy="130" r="1.3"/>
    <circle cx="150" cy="500" r="1"/>
    <circle cx="1080" cy="500" r="1.2"/>
  </g>
  <!-- Glow overlay -->
  <rect width="1200" height="630" fill="url(#glow6)"/>
  <!-- Corner accents -->
  <rect x="40" y="40" width="60" height="3" rx="1.5" fill="#2dd4bf" opacity="0.6"/>
  <rect x="40" y="40" width="3" height="60" rx="1.5" fill="#2dd4bf" opacity="0.6"/>
  <rect x="1100" y="587" width="60" height="3" rx="1.5" fill="#2dd4bf" opacity="0.6"/>
  <rect x="1157" y="530" width="3" height="60" rx="1.5" fill="#2dd4bf" opacity="0.6"/>
</svg>