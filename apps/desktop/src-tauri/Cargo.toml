[package]
name = "xenboox-desktop"
version = "1.0.0"
description = "Xenboox Desktop — AI-native accounting platform"
authors = ["Xenboox"]
edition = "2021"

[lib]
name = "xenboox_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["api-all", "window-all", "dialog-all", "path-all"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate"] }
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
aes-gcm = "0.10"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
anyhow = { version = "1", features = ["backtrace"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
