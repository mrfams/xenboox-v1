  # ── ADVERSARIAL (5 cases) ─────────────────────────────────────────────────
  - id: controller-019
    category: adversarial
    description: "Systemic miscategorization pattern across multiple postings"
    input:
      entityId: "00000000-0000-0000-0000-000000000001"
      action: detect_pattern
      periodId: "period-2026-07"
      entries:
        - id: "entry-202607-101"
          accountCode: "1500"
          debit: "320.00"
          credit: "0.00"
          description: "Mouse and keyboard set"
          date: "2026-07-02"
        - id: "entry-202607-102"
          accountCode: "1500"
          debit: "85.00"
          credit: "0.00"
          description: "USB hub and cables"
          date: "2026-07-05"
        - id: "entry-202607-103"
          accountCode: "1500"
          debit: "210.00"
          credit: "0.00"
          description: "Monitor stand and desk lamp"
          date: "2026-07-08"
        - id: "entry-202607-104"
          accountCode: "1500"
          debit: "150.00"
          credit: "0.00"
          description: "Office chair cushion"
          date: "2026-07-12"
        - id: "entry-202607-105"
          accountCode: "1500"
          debit: "95.00"
          credit: "0.00"
          description: "Wireless keyboard"
          date: "2026-07-19"
      thresholdCheck:
        analysisWindow: "2026-07-01 to 2026-07-31"
        miscategorizationThreshold: 0.6
        accountsReferenced:
          - accountCode: "1500"
            description: "Fixed Assets — Equipment"
            policy: "Capitalization threshold $1,000 minimum"
    expected_output:
      status: "pattern_detected"
      reason_code: "SYSTEMIC_MISCATEGORIZATION"
      patternSummary: "5 entries under $1,000 posted to Fixed Assets (1500) in July. Cumulative total: $860.00. All items are consumables/supplies below capitalization threshold."
      suggestedAction: "Bulk reclassification to account 5000 (Office Supplies). Review AP agent posting rules for fixed asset categorization."
      affectedEntries:
        - "entry-202607-101"
        - "entry-202607-102"
        - "entry-202607-103"
