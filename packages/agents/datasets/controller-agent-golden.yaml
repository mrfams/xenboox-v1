  # ── EDGE CASES (8 cases) ─────────────────────────────────────────────────
  - id: controller-011
    category: edge_case
    description: "Miscategorized expense — office supplies coded as equipment"
    input:
      entityId: "00000000-0000-0000-0000-000000000001"
      action: review_entry
      entry:
        id: "entry-202607-011"
        accountCode: "1500"
        debit: "450.00"
        credit: "0.00"
        description: "Printer paper and toner cartridges"
        reference: "SUP-PAPER-2026-07"
        date: "2026-07-08"
        periodId: "period-2026-07"
        sourceAgent: "ap-agent"
      supportingDocs:
        - type: invoice
          reference: "OFF-MAX-INV-889"
          amount: "450.00"
          vendor: "OfficeMax Ltd"
          items:
            - description: "A4 printer paper — 10 reams"
              amount: "120.00"
            - description: "Toner cartridge — black"
              amount: "330.00"
    expected_output:
      status: "correction_required"
      entryId: "entry-202607-011"
      reason_code: "MISCATEGORIZATION"
      suggestedCorrection:
        accountCode: "5000"
        debit: "450.00"
        credit: "0.00"
        description: "Office supplies — printer paper and toner"
      reviewNotes: "Consumable supplies miscategorized as fixed asset. Amount ($450) is below capitalization threshold ($1,000). Reclassify to office supplies expense."
    expected_confidence_range: [0.9, 1.0]
    expected_escalation: flag
    expected_escalation_target: ap-agent
    source: synthetic
    notes: "Agent should flag miscategorization and suggest corrective reclassification"

