      workerReports:
        - workerId: payroll-worker-1
          status: flagged
          employeesProcessed: 8
          errorsReported:
            - employeeId: "EMP-005"
              issue: "PAYE calculation mismatch"
              expectedPaye: "850.00"
              calculatedPaye: "920.00"
              variance: "-70.00"
            - employeeId: "EMP-009"
              issue: "SSNIT deduction exceeds ceiling"
              expectedSsnit: "345.00"
              calculatedSsnit: "400.00"
              variance: "-55.00"
    expected_output:
      status: "flagged"
      review_required: true
      error_count: 2
      affected_employees:
        - employeeId: "EMP-005"
          issue: "PAYE_CALCULATION_MISMATCH"
          correction: "Recalculate PAYE using correct tax bands"
        - employeeId: "EMP-009"
          issue: "SSNIT_EXCEEDS_CEILING"
          correction: "Apply SSNIT earnings cap of 13800.00"
      recommendations:
        - "Send corrections back to payroll-worker-1 for re-processing"
    expected_confidence_range: [0.9, 1.0]
    expected_escalation: flag
    expected_escalation_target: payroll-worker-agent
