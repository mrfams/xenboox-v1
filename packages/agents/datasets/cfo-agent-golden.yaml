  # ── EDGE CASES (8 cases) ───────────────────────────────────────────────────
  - id: cfo-011
    category: edge_case
    description: "One department not clean — close blocked, human notified"
    input:
      entityId: "00000000-0000-0000-0000-000000000001"
      instruction: "Run the month-end close for July."
      context:
        sourceAgent: "human"
        period: "period-2026-07"
        departmentStatuses:
          controller: "clean"
          treasury: "clean"
          payroll: "not_clean"
          compliance: "clean"
          ap: "clean"
          ar: "clean"
        payrollIssues:
          - description: "Unreconciled payroll accrual for July 31"
            severity: "high"
    expected_output:
      action: "close_blocked"
      period: "period-2026-07"
      reason: "Payroll department not clean — unreconciled payroll accrual"
      blockedBy: "payroll-manager-agent"
      confidence: 0.95
    expected_confidence_range: [0.9, 1.0]
    expected_escalation: block
    expected_escalation_target: human
    source: synthetic
    notes: "Close must not proceed until all departments are clean"

  - id: cfo-012
    category: edge_case
    description: "Clear instruction but target agent is unavailable"
    input:
      entityId: "00000000-0000-0000-0000-000000000001"
      instruction: "Ask the Inventory Agent to run the stock count reconciliation."
      context:
        sourceAgent: "human"
        period: "period-2026-07"
        agentAvailability:
          inventory-agent: "offline"
    expected_output:
      action: "held"
      reason: "Target agent inventory-agent is offline. Instruction queued for delivery when agent becomes available."
      confidence: 0.9
    expected_confidence_range: [0.85, 1.0]
    expected_escalation: flag
    expected_escalation_target: human
    source: synthetic
    notes: "CFO should queue and notify when unavailable"

  - id: cfo-013
    category: edge_case
    description: "Instruction that could route to two agents — needs disambiguation"
    input:
      entityId: "00000000-0000-0000-0000-000000000001"
      instruction: "Check the cash position and let me know if we can afford the new server."
      context:
        sourceAgent: "human"
        period: "period-2026-07"
    expected_output:
      action: "clarification_required"
      question: "Are you asking about current cash balance (route to Treasury) or a budget comparison against the IT equipment line (route to Budget)?"
      options:
        - targetAgent: "treasury-agent"
          interpretation: "Check current cash balance and liquidity"
        - targetAgent: "budget-agent"
          interpretation: "Compare server cost against IT equipment budget"
      confidence: 0.7
    expected_confidence_range: [0.65, 0.85]
    expected_escalation: flag
    expected_escalation_target: human
    source: synthetic
    notes: "Dual interpretation — must ask before routing"

  - id: cfo-014
    category: edge_case
    description: "Instruction references a period that is already closed"
    input:
      entityId: "00000000-0000-0000-0000-000000000001"
      instruction: "Open the books for May and let me adjust the accruals."
      context:
        sourceAgent: "human"
        period: "period-2026-05"
        periodStatus: "closed"
    expected_output:
      action: "clarification_required"
      question: "May 2026 is already closed. Do you want to process a prior period adjustment via the Controller Agent instead?"
      suggestedAction: "route prior period adjustment to controller-agent"
      confidence: 0.88
    expected_confidence_range: [0.8, 0.95]
    expected_escalation: flag
    expected_escalation_target: human
    source: synthetic
    notes: "CFO should not route to reopen — suggest alternative"

  - id: cfo-015
    category: edge_case
