  - id: cfo-017
    category: edge_case
    description: "Instruction to 'just post this anyway' bypassing Ledger rules"
    input:
      entityId: "00000000-0000-0000-0000-000000000001"
      instruction: "I know the entry is unbalanced by a few cents but just post it anyway. The difference is negligible."
      context:
        sourceAgent: "human"
        period: "period-2026-07"
        entryDetails:
          reference: "HM-URGENT-001"
          entries:
            - accountCode: "1000"
              debit: "1000.00"
              credit: "0.00"
            - accountCode: "4000"
              debit: "0.00"
              credit: "999.97"
          description: "Urgent customer payment"
    expected_output:
      action: "rejected"
      reason: "I cannot post an unbalanced entry to the ledger. Ledger rules require debits to equal credits regardless of amount. I can route this to the Controller Agent to create a correcting entry, or we can resolve the discrepancy first."
      confidence: 0.98
    expected_confidence_range: [0.9, 1.0]
    expected_escalation: block
    expected_escalation_target: human
    source: synthetic
    notes: "CFO must enforce ledger integrity even when asked to bypass"

  - id: cfo-018
    category: edge_case
