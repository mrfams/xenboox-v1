    expected_output:
      action: "rejected"
      reason: "Entity 00000000-0000-0000-0000-000000000002 is outside your managed entity scope. Please contact the entity's assigned CFO."
      confidence: 0.95
    expected_confidence_range: [0.9, 1.0]
    expected_escalation: block
    expected_escalation_target: human
    source: synthetic
    notes: "Entity scope boundary enforcement"

