  - id: doc-004
    category: happy_path
    description: "Tesseract fails — Vision API fallback succeeds"
    input:
      entityId: "00000000-0000-0000-0000-000000000001"
      documentType: "invoice"
      file:
        format: "jpg"
        source: "photo"
        filename: "INV-PHOTO-001.jpg"
        sizeBytes: 3200000
        resolution: "2048x1536"
      ocrResults:
        primary:
          engine: "tesseract"
          confidence: 0.25
          rawText: "INVOI(E\nIn oice  INV 2026  07  002\nD te   2026 07 16\n endor  XY  orp\nAmo nt  $2, 00.00"
          error: "LOW_CONFIDENCE"
        fallback:
          engine: "vision-api"
          confidence: 0.94
          rawText: "INVOICE\nInvoice #: INV-2026-07-002\nDate: 2026-07-16\nVendor: XYZ Corp\nAmount: $2,500.00\nDescription: Consulting services\nPayment Terms: Net 15"
      classification:
        primaryType: "invoice"
        confidence: 0.93
        alternatives:
          - type: "receipt"
            confidence: 0.07
    expected_output:
      status: "extracted"
      extractedFields:
        documentReference: "INV-2026-07-002"
        documentDate: "2026-07-16"
        vendorName: "XYZ Corp"
        totalAmount: 2500.00
        currency: "USD"
        description: "Consulting services"
        paymentTerms: "Net 15"
      ocrEngine: "vision-api"
      ocrConfidence: 0.94
      fallbackTriggered: true
      primaryOcrEngine: "tesseract"
      primaryOcrConfidence: 0.25
      classification: "invoice"
      classificationConfidence: 0.93
      confidence: 0.93
    expected_confidence_range: [0.85, 1.0]
    expected_escalation: none
    expected_escalation_target: null
    source: synthetic
    notes: "Fallback chain works — Vision API rescued low Tesseract confidence"

