  - id: doc-011
    category: edge_case
    description: "Handwritten receipt extracted with low confidence (Vision API fallback triggered)"
    input:
      entityId: "00000000-0000-0000-0000-000000000001"
      documentType: "receipt"
      file:
        format: "jpg"
        source: "photo"
        filename: "HANDWRITTEN-RCPT-001.jpg"
        sizeBytes: 4100000
        resolution: "3024x4032"
      ocrResults:
        primary:
          engine: "tesseract"
          confidence: 0.35
          rawText: "Re eipt\nD te  Jul 18\nStor  c rner Shop\n mount $45 50\n ash"
          error: "LOW_CONFIDENCE"
        fallback:
          engine: "vision-api"
          confidence: 0.78
          rawText: "RECEIPT\nDate: July 18, 2026\nStore: Corner Shop\nItems: Notebooks, Pens\nTotal: $45.50\nPayment: Cash"
      classification:
        primaryType: "receipt"
        confidence: 0.88
        alternatives:
          - type: "invoice"
            confidence: 0.12
    expected_output:
      status: "extracted"
      extractedFields:
        documentDate: "2026-07-18"
        merchantName: "Corner Shop"
        totalAmount: 45.50
        currency: "USD"
        paymentMethod: "Cash"
        items:
          - description: "Notebooks, Pens"
            amount: 45.50
      ocrEngine: "vision-api"
      ocrConfidence: 0.78
      fallbackTriggered: true
      primaryOcrEngine: "tesseract"
      primaryOcrConfidence: 0.35
      classification: "receipt"
      classificationConfidence: 0.88
      confidence: 0.78
    expected_confidence_range: [0.7, 0.85]
    expected_escalation: flag
    expected_escalation_target: controller-agent
    source: synthetic
    notes: "Low confidence extraction — Vision API improved but still below threshold"

