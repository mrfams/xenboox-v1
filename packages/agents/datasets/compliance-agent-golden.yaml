          standardRated: "100000.00"
          zeroRated: "20000.00"
          exempt: "5000.00"
        reconciliationStatus: unbalanced
        discrepancy:
          expectedOutputVat: "15000.00"
          declaredOutputVat: "13500.00"
          variance: "-1500.00"
