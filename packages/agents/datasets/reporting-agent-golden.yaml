  - id: rpt-005
    category: happy_path
    description: "Narrative summary that accurately reflects specific figures"
    input:
      entityId: "00000000-0000-0000-0000-000000000001"
      reportType: "narrative"
      period: "period-2026-07"
      parameters:
        customRequest: "Write a one-paragraph executive summary of this month's financial performance."
        format: "narrative"
        audience: "executive"
      data:
        revenue: 75000.00
        expenses: 36000.00
        netIncome: 39000.00
        revenueVsBudget: 5000.00
        expenseVsBudget: -2000.00
        cashPosition: 205000.00
        keyEvents:
          - "New donor grant of $100,000 received"
          - "Major supplier contract renegotiated saving $3,000/month"
    expected_output:
      status: "generated"
      narrative: "In July 2026, the organization generated $75,000 in revenue against $36,000 in expenses, yielding a net income of $39,000 and a 52% profit margin. Revenue exceeded budget by $5,000 driven by strong service delivery, while expenses came in $2,000 under budget due to cost-saving measures. Cash position stood at $205,000 at month-end. Notable events include receipt of a new $100,000 donor grant and renegotiation of a major supplier contract, saving $3,000 per month."
      confidence: 0.96
    expected_confidence_range: [0.9, 1.0]
    expected_escalation: none
    expected_escalation_target: null
    source: synthetic
    notes: "Narrative must exactly match the figures provided, not approximate"

