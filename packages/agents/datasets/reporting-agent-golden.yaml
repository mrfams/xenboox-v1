  # ── EDGE CASES (8 cases) ───────────────────────────────────────────────────
  - id: rpt-011
    category: edge_case
    description: "Request for data that doesn't exist — says so explicitly"
    input:
      entityId: "00000000-0000-0000-0000-000000000001"
      reportType: "custom"
      period: "period-2026-07"
      parameters:
        customRequest: "Show me the Q3 2027 projections."
        format: "tabular"
        currency: "USD"
      data:
        availablePeriods:
          [
            "period-2026-01",
            "period-2026-02",
            "period-2026-03",
            "period-2026-04",
            "period-2026-05",
            "period-2026-06",
            "period-2026-07",
          ]
    expected_output:
      status: "not_found"
      reason: "Q3 2027 projection data does not exist in the system. The latest available data is for July 2026. Forecast or projection data has not been loaded for Q3 2027."
      confidence: 0.98
    expected_confidence_range: [0.9, 1.0]
    expected_escalation: flag
    expected_escalation_target: human
    source: synthetic
    notes: "Must not fabricate data — say it doesn't exist"

  - id: rpt-012
    category: edge_case
    description: "Unbalanced trial balance — report generation rejected"
    input:
      entityId: "00000000-0000-0000-0000-000000000001"
      reportType: "profit_and_loss"
      period: "period-2026-07"
      parameters:
        startDate: "2026-07-01"
        endDate: "2026-07-31"
        currency: "USD"
        format: "standard"
      trialBalance:
        - accountCode: "4000"
          accountName: "Revenue"
          balance: 50000.00
          type: "revenue"
        - accountCode: "5000"
          accountName: "Expenses"
          balance: 30000.00
          type: "expense"
        - accountCode: "9999"
          accountName: "Suspense"
          balance: 5000.00
          type: "suspense"
    expected_output:
      status: "rejected"
      reason: "Trial balance is not balanced — difference of $5,000.00 in suspense account. Reports cannot be generated from an unbalanced trial balance. Please resolve the suspense balance first."
      confidence: 0.96
    expected_confidence_range: [0.9, 1.0]
    expected_escalation: block
    expected_escalation_target: controller-agent
    source: synthetic
    notes: "Reports require a balanced trial balance"

