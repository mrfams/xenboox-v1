  # -- EDGE CASES (8 cases) --
  - id: mm-011
    category: edge_case
    description: "Timing difference flagged vs real discrepancy -- Wave payment with 1-day settlement lag"
    input:
      entityId: "00000000-0000-0000-0000-000000000001"
      rail: "Wave"
      transactionId: "WAVE-2026-07-24-001"
      transactionDate: "2026-07-24"
      amountPaid: "500.00"
      amountReceived: "490.00"
      fee: "10.00"
      settlementDate: "2026-07-25"
      bankCreditDate: "2026-07-25"
      ledgerRecordedDate: "2026-07-24"
      ledgerAmount: "490.00"
      ledgerExpectedDate: "2026-07-24"
    expected_output:
      status: "timing_difference"
      matchType: "settlement_lag"
      transactionAmount: "490.00"
      settlementDate: "2026-07-25"
      ledgerDate: "2026-07-24"
      dateDifferenceDays: 1
      shouldFlagAsDiscrepancy: false
    expected_confidence_range: [0.85, 0.95]
    expected_escalation: none
    expected_escalation_target: null
    source: synthetic
    notes: "Ledger recorded on transaction date, bank credit arrives T+1. This is expected Wave settlement timing. Must NOT be flagged as a discrepancy."

  - id: mm-012
    category: edge_case
    description: "Timing difference that IS a real discrepancy -- payment expected but never settles"
    input:
      entityId: "00000000-0000-0000-0000-000000000001"
      rail: "MTN_MoMo"
      transactionId: "MTN-2026-07-10-UNSETTLED"
      transactionDate: "2026-07-10"
      amountReceived: "600.00"
      fee: "0.00"
      netAmount: "600.00"
      settlementExpectedDate: "2026-07-11"
      currentDate: "2026-07-24"
      settlementStatus: "pending"
      daysSinceTransaction: 14
    expected_output:
      status: "flagged_real_discrepancy"
      reason: "UNSETTLED_BEYOND_EXPECTED_WINDOW"
      daysSinceTransaction: 14
      expectedSettlementWindowDays: 2
      action: "escalate_to_rail_support"
    expected_confidence_range: [0.85, 0.95]
    expected_escalation: flag
    expected_escalation_target: controller-agent
    source: synthetic
    notes: "MTN MoMo typically settles within 1-2 business days. 14 days without settlement is a real discrepancy, not a timing difference. Escalate."

