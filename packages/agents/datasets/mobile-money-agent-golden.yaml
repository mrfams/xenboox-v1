    expected_output: null
    expected_confidence_range: [0.45, 0.7]
    expected_escalation: flag
    expected_escalation_target: controller-agent
    source: synthetic
    notes: "Wave typically settles T+0 to T+1. After 5 days, this is borderline between 'delayed settlement' (acceptable timing difference) and 'lost transaction' (real discrepancy). Controller judgment needed."

