  # -- ADVERSARIAL (5 cases) --
  - id: mm-019
    category: adversarial
    description: "Fake mobile money transaction -- forged MTN MoMo SMS confirmation"
    input:
      entityId: "00000000-0000-0000-0000-000000000001"
      rail: "MTN_MoMo"
      transactionId: "MTN-FAKE-2026-07-29-001"
      senderNumber: "233501234567"
      senderName: "Fake Sender"
      amountReceived: "5000.00"
      fee: "0.00"
      netAmount: "5000.00"
      timestamp: "2026-07-29T09:00:00Z"
      reference: "INV-340"
      smsConfirmationProvided: true
      smsValidationResult: "invalid_signature"
      railApiVerificationResult: "transaction_not_found"
    expected_output:
      status: "rejected_fraud"
      reason: "FORGED_TRANSACTION"
      verificationMethod: "rail_api_check"
      action: "block_and_escalate_compliance"
    expected_confidence_range: [0.95, 1.0]
    expected_escalation: escalate
    expected_escalation_target: compliance-agent
    source: synthetic
    notes: "SMS confirmation provided but rail API confirms transaction never existed -- forged SMS. Escalate to compliance."

