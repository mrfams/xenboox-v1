  - id: treasury-011
    category: edge_case
    description: "Individually fine reports but combined reveals cash concentration risk in mobile money wallet"
    input:
      entityId: "00000000-0000-0000-0000-000000000001"
      action: consolidated_cash_position
      asOfDate: "2026-07-20"
      streams:
        reconciliation:
          bankName: "Access Bank Ghana"
          accountNumber: "ACC-1001"
          ledgerBalance: "60000.00"
          availableBalance: "60000.00"
          status: "reconciled"
          notes: "All items matched. No discrepancies."
        cash:
          accountCode: "1010"
          bookBalance: "60000.00"
          bankBalance: "60000.00"
          status: "matched"
          notes: "Bank and book balances match."
        mobileMoney:
          provider: "MTN Mobile Money"
          walletId: "WAL-MTN-001"
          balance: "140000.00"
          status: "verified"
          notes: "All transactions verified. Balance confirmed with provider."
      thresholds:
        concentrationLimit: 0.7
        totalCash: "200000.00"
        mobileMoneyPercentage: 0.7
    expected_output:
      status: "warning"
      consolidatedCash: "200000.00"
      riskLevel: "medium"
      concentrationWarnings:
        - provider: "MTN Mobile Money"
          balance: "140000.00"
          percentageOfTotal: 0.7
          threshold: 0.7
          risk: "Mobile money concentration at exactly 70% limit. Any further deposits to MTN will breach concentration threshold."
      summary: "Individual streams are clean, but 70% of total cash is in a single mobile money wallet. High concentration risk. Recommend diversifying across rails or sweeping to bank account."
    expected_confidence_range: [0.9, 1.0]
    expected_escalation: flag
    expected_escalation_target: controller-agent
    source: synthetic
    notes: "Stream-level health masks aggregate concentration risk — the masking failure mode"

