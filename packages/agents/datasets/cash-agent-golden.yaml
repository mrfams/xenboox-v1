  - id: cash-011
    category: edge_case
    description: "Imprest retirement with minor receipt variance — 15 GHS short (partially accounted)"
    input:
      entityId: "00000000-0000-0000-0000-000000000001"
      imprestId: "IMPR-2026-07-071"
      officerName: "Yaw Boadi"
      issuedAmount: "600.00"
      receiptTotal: "585.00"
      receipts:
        - description: "Field supplies — Ho region"
          amount: "350.00"
          receiptRef: "SUPP-HO-001"
        - description: "Transportation"
          amount: "235.00"
          receiptRef: "TRANS-HO-002"
      explanation: "Lost receipt for 15 GHS — market gate fee, no receipt issued"
      retirementDate: "2026-07-18"
      currency: "GHS"
    expected_output:
      status: "retired"
      amountRetired: "585.00"
      variance: "-15.00"
      varianceHandling: "allow_but_flag"
      flagged: true
    expected_confidence_range: [0.85, 0.95]
    expected_escalation: flag
    expected_escalation_target: controller-agent
    source: synthetic
    notes: "Minor shortage with explanation — allow retirement but flag for controller awareness"

