        cost: "3000.00"
        residualValue: "0.00"
        usefulLifeYears: 5
        accumulatedDepreciation: "3000.00"
        netBookValue: "0.00"
        fullyDepreciated: true
        stillInUse: true
        physicalCondition: good
        estimatedRemainingUsefulLife: "2 years"
    expected_output:
      status: "flagged"
      fully_depreciated_but_in_use: true
      net_book_value: "0.00"
