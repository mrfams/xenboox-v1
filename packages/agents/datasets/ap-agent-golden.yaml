      lineItems:
        - description: "A4 copy paper — 22 cartons"
          quantity: 22
          unitPrice: 25.00
          total: 550.00
        - description: "Printer toner cartridges — 5 units"
          quantity: 5
          unitPrice: 100.00
          total: 500.00
      paymentTerms: "NET30"
