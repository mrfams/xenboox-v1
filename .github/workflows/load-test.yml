name: Load Tests (k6)

# Nightly + manual run of the k6 load suite against a staging environment.
# Gated behind secrets so it only runs when staging exists — never against
# production. Re-run after every DB/index/partition change (§25.1).
#
# Secrets to configure in the repo:
#   LOAD_TEST_URL      — staging base URL, e.g. https://staging.xenboox.com
#   LOAD_TEST_EMAIL    — staging user (verified email)
#   LOAD_TEST_PASSWORD — staging password (never commit)
#   LOAD_TEST_ENTITY_ID — staging entity UUID for tRPC calls

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *" # nightly 02:00 UTC

permissions:
  contents: read

jobs:
  load-test:
    name: k6 load suite
    runs-on: ubuntu-latest
    # Only run when staging creds exist; skip silently otherwise so a missing
    # staging env never fails the repo's default CI. The secrets context is
    # not available in job-level `if` — the env-var check below is the
    # supported pattern for secret presence gating.
    steps:
      - uses: actions/checkout@v4

      - uses: grafana/setup-k6-action@v1

      - name: Smoke (stack alive)
        env:
          K6_BASE_URL: ${{ secrets.LOAD_TEST_URL }}
          K6_USER_EMAIL: ${{ secrets.LOAD_TEST_EMAIL }}
          K6_USER_PASSWORD: ${{ secrets.LOAD_TEST_PASSWORD }}
          K6_ENTITY_ID: ${{ secrets.LOAD_TEST_ENTITY_ID }}
        run: k6 run load-tests/smoke.js

      - name: Auth flow (100 VUs)
        env:
          K6_BASE_URL: ${{ secrets.LOAD_TEST_URL }}
          K6_USER_EMAIL: ${{ secrets.LOAD_TEST_EMAIL }}
          K6_USER_PASSWORD: ${{ secrets.LOAD_TEST_PASSWORD }}
          K6_ENTITY_ID: ${{ secrets.LOAD_TEST_ENTITY_ID }}
        run: k6 run load-tests/auth-flow.js

      - name: Read-heavy (p95 < 300ms)
        env:
          K6_BASE_URL: ${{ secrets.LOAD_TEST_URL }}
          K6_USER_EMAIL: ${{ secrets.LOAD_TEST_EMAIL }}
          K6_USER_PASSWORD: ${{ secrets.LOAD_TEST_PASSWORD }}
          K6_ENTITY_ID: ${{ secrets.LOAD_TEST_ENTITY_ID }}
        run: k6 run load-tests/read-heavy.js

      - name: Write-heavy (p99 < 1s)
        env:
          K6_BASE_URL: ${{ secrets.LOAD_TEST_URL }}
          K6_USER_EMAIL: ${{ secrets.LOAD_TEST_EMAIL }}
          K6_USER_PASSWORD: ${{ secrets.LOAD_TEST_PASSWORD }}
          K6_ENTITY_ID: ${{ secrets.LOAD_TEST_ENTITY_ID }}
        run: k6 run load-tests/write-heavy.js

      - name: Realtime SSE budget
        env:
          K6_BASE_URL: ${{ secrets.LOAD_TEST_URL }}
          K6_USER_EMAIL: ${{ secrets.LOAD_TEST_EMAIL }}
          K6_USER_PASSWORD: ${{ secrets.LOAD_TEST_PASSWORD }}
          K6_ENTITY_ID: ${{ secrets.LOAD_TEST_ENTITY_ID }}
        run: k6 run load-tests/realtime.js

      - name: Breakpoint ramp (informational)
        continue-on-error: true # documents the breaking point; not a gate
        env:
          K6_BASE_URL: ${{ secrets.LOAD_TEST_URL }}
          K6_USER_EMAIL: ${{ secrets.LOAD_TEST_EMAIL }}
          K6_USER_PASSWORD: ${{ secrets.LOAD_TEST_PASSWORD }}
          K6_ENTITY_ID: ${{ secrets.LOAD_TEST_ENTITY_ID }}
        run: k6 run load-tests/ramp.js
