name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck (ledger + web — blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The web app's full typecheck needs headroom (OOMs at the default heap)
      - run: pnpm --filter=@xenboox/ledger typecheck
      - run: pnpm --filter=@xenboox/web typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  typecheck-rest:
    name: Typecheck (remaining packages — non-blocking debt visibility)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pre-existing failures (ingestion rootDir refs, jobs triaged) — tracked
      # in ENGINEERING_SYSTEM.md; flips to blocking as each package is cleaned.
      - run: pnpm --filter=@xenboox/agents --filter=@xenboox/ingestion --filter=@xenboox/jobs --filter=@xenboox/ui typecheck

  test:
    name: Test (ledger + epoch0 regression guard — blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@xenboox/ledger test
      - run: pnpm --filter=@xenboox/web exec vitest run "__tests__/epoch0-*.test.ts"
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  test-full:
    name: Test (full suite — non-blocking debt visibility)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@xenboox/web test
      - run: pnpm --filter=@xenboox/agents test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@xenboox/web test:coverage
      - run: pnpm --filter=@xenboox/agents test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/web/coverage/
            packages/agents/coverage/
          retention-days: 7

  eval:
    name: Agent Eval
    runs-on: ubuntu-latest
    needs: [typecheck]
    paths:
      - "packages/agents/**"
      - "packages/models/**"
      - "packages/jobs/**"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@xenboox/agents test:eval

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter=@xenboox/web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}

  e2e:
    name: E2E (Playwright — anon marketing + onboarding)
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xenboox
          POSTGRES_PASSWORD: xenboox
          POSTGRES_DB: xenboox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xenboox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://xenboox:xenboox@localhost:5432/xenboox
      AUTH_SECRET: test-secret-for-ci-only
      NEXTAUTH_URL: http://127.0.0.1:3000
      BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm build --filter=@xenboox/web
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Run Playwright auth-setup (create storageState)
        run: pnpm --filter=@xenboox/web test:e2e --project=auth-setup
      - name: Run Playwright (anon marketing + compare)
        run: pnpm --filter=@xenboox/web test:e2e --project=anon-chromium
      - name: Run Playwright (authenticated dashboard flows)
        run: pnpm --filter=@xenboox/web test:e2e --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  Migrations:
    name: Migrations (apply on fresh Postgres + drift check)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xenboox
          POSTGRES_PASSWORD: xenboox
          POSTGRES_DB: xenboox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xenboox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://xenboox:xenboox@localhost:5432/xenboox
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply every migration to a fresh database
        run: pnpm db:migrate
      - name: Verify schema is in sync with migrations (no drift)
        run: |
          before=$(find packages/db/migrations -maxdepth 1 -name "*.sql" | wc -l)
          pnpm --filter=@xenboox/db generate --name drift_check > /tmp/gen.log 2>&1 || true
          after=$(find packages/db/migrations -maxdepth 1 -name "*.sql" | wc -l)
          echo "migration files before=$before after=$after"
          if [ "$after" -gt "$before" ]; then
            echo "::error::Schema drift detected — run pnpm db:generate and commit the new migration"
            exit 1
          fi
