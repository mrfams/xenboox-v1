  # ── HAPPY PATH (6 of 20 target) ──────────────────────────────────────────

  - id: ledger-001
    category: happy_path
    description: "Standard cash sale, single currency (GMD), complete data"
    input:
      entity_id: "test-entity-001"
      requesting_agent: "ar-agent"
      entry_date: "2026-07-15"
      description: "Cash sale - Invoice INV-1042"
      source_reference: { type: "invoice", id: "INV-1042" }
      lines:
        - {
            account_code: "1000-CASH",
            debit: 5000.00,
            credit: null,
            currency: "GMD",
          }
        - {
            account_code: "4000-SALES-REVENUE",
            debit: null,
            credit: 5000.00,
            currency: "GMD",
          }
    expected_output:
      status: "posted"
      balanced: true
      total_debits: 5000.00
      total_credits: 5000.00
    expected_confidence_range: [0.95, 1.0]
    expected_escalation: none
    expected_escalation_target: null
    source: synthetic
    notes: "Baseline balanced entry, exact account codes provided, no ambiguity"

