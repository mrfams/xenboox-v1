    description: "Unbalanced entry - off by 0.01 due to upstream rounding error"
    input:
      entity_id: "test-entity-001"
      requesting_agent: "ap-agent"
      entry_date: "2026-07-19"
      description: "Vendor payment with rounding discrepancy"
      source_reference: { type: "payment", id: "PO-1102" }
      lines:
        - {
            account_code: "2000-ACCOUNTS-PAYABLE",
            debit: 899.99,
            credit: null,
            currency: "GMD",
          }
        - {
            account_code: "1010-BANK-GT",
            debit: null,
            credit: 900.00,
            currency: "GMD",
          }
    expected_output: null
    expected_confidence_range: [0.0, 0.0]
    expected_escalation: block
    expected_escalation_target: controller-agent
