  # ── AMBIGUOUS (3 of 10 target) ───────────────────────────────────────────

  - id: ledger-014
    category: ambiguous
    description: "Expense described only as 'equipment' with no clear account code — could be IT equipment, office equipment, or a fixed asset requiring capitalization rather than expensing"
    input:
      entity_id: "test-entity-001"
      requesting_agent: "document-agent"
      entry_date: "2026-07-19"
      description: "Equipment purchase - description only, no account code resolved by requesting agent"
      source_reference: { type: "invoice", id: "INV-4471" }
      lines:
        - {
            account_code: null,
            debit: 8500.00,
            credit: null,
            currency: "GMD",
            _unresolved_description: "equipment",
          }
        - {
            account_code: "2000-ACCOUNTS-PAYABLE",
            debit: null,
            credit: 8500.00,
            currency: "GMD",
          }
    expected_output: null
    expected_confidence_range: [0.4, 0.6]
    expected_escalation: block
    expected_escalation_target: controller-agent
    source: synthetic
    notes: "Amount is large enough (8500) that misclassifying as expense vs. capitalized fixed asset is materially significant — must not guess. Core test of PRD §6.7 'never guess silently'."

  - id: ledger-015
    category: ambiguous
    description: "Correction request where the offsetting entry's account choice is itself questionable — Controller Agent's correction disagrees with what the golden dataset precedent would suggest"
    input:
      entity_id: "test-entity-001"
      requesting_agent: "controller-agent"
      entry_date: "2026-07-19"
      description: "Correction: reclassify marketing spend to travel"
      source_reference: { type: "correction", id: "CORR-0019" }
      correction_of_entry_id: "ledger-entry-uuid-1204"
      lines:
        - {
            account_code: "6700-TRAVEL-EXPENSE",
            debit: 2200.00,
            credit: null,
            currency: "GMD",
          }
        - {
            account_code: "6800-MARKETING-EXPENSE",
            debit: null,
            credit: 2200.00,
            currency: "GMD",
          }
    expected_output: null
    expected_confidence_range: [0.5, 0.7]
    expected_escalation: flag
    expected_escalation_target: "controller-agent,audit-agent"
    source: disagreement_derived
    notes: "Even Controller-originated corrections aren't auto-trusted if the reclassification itself is a large amount with no supporting note. Tests CONFIDENCE_AND_ESCALATION.md §6 disagreement mechanism — flagged to Audit Agent as a golden-dataset-worthy case per that section's logging requirement."

  - id: ledger-016
    category: ambiguous
    description: "Entry date falls in a period already closed - agent must decide whether this requires close reopening rather than simply posting"
    input:
      entity_id: "test-entity-001"
      requesting_agent: "ap-agent"
      entry_date: "2026-06-15"
      description: "Late-arriving supplier invoice for a closed period"
      source_reference: { type: "invoice", id: "INV-LATE-0007" }
      lines:
        - {
            account_code: "6100-OFFICE-SUPPLIES",
            debit: 180.00,
            credit: null,
            currency: "GMD",
          }
        - {
            account_code: "2000-ACCOUNTS-PAYABLE",
            debit: null,
            credit: 180.00,
            currency: "GMD",
          }
    expected_output: null
    expected_confidence_range: [0.3, 0.5]
    expected_escalation: block
    expected_escalation_target: cfo-agent
    source: synthetic
    notes: "Mechanically balanced and valid, but posting into a closed period bypasses PRD §8 Error Recovery Flow if allowed silently. Must escalate to CFO Agent (owns close/reopen decisions) rather than post directly, regardless of how clean the entry itself looks."

