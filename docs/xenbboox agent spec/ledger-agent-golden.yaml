  # ── EDGE CASE (4 of 15 target) ───────────────────────────────────────────

  - id: ledger-007
    category: edge_case
    description: "Multi-currency entry - USD invoice against GMD base currency"
    input:
      entity_id: "test-entity-001"
      requesting_agent: "ar-agent"
      entry_date: "2026-07-19"
      description: "USD invoice payment received"
      source_reference: { type: "payment", id: "INV-USD-0021" }
      lines:
        - {
            account_code: "1010-BANK-GT",
            debit: 571.50,
            credit: null,
            currency: "USD",
            exchange_rate: 62.71,
            base_currency_amount: 35837.87,
          }
        - {
            account_code: "1100-ACCOUNTS-RECEIVABLE",
            debit: null,
            credit: 571.50,
            currency: "USD",
            exchange_rate: 62.71,
            base_currency_amount: 35837.87,
          }
    expected_output:
      status: "posted"
      balanced: true
    expected_confidence_range: [0.85, 0.97]
    expected_escalation: none
    expected_escalation_target: null
    source: synthetic
    notes: "PRD §12 multi-currency — exchange_rate and base_currency_amount both required and present"

